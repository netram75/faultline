[project]
name = "faultline"
version = "0.0.1"
description = "A replicated key-value store built to survive crashes, tested by breaking it on purpose."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Netram Faran" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
faultline = "faultline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify, ruff's own
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
